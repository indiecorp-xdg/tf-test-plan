name: 'Infra Test Deploy to Azure'

on:
  push:
    branches:
      - dev
  workflow_dispatch:

# Required for OIDC authentication
permissions:
  id-token: write
  contents: read

env:
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true 

jobs:
  terraform-deploy:
    name: 'Terraform Deploy'
    runs-on: ubuntu-latest
    #environment: production # Optional: link to a GitHub environment

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4

      - name: 'Setup Terraform'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      - name: 'Azure Login'
        uses: azure/login@v1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: 'Terraform Init'
        run: |
          cd envs/dev
          terraform init \
            -backend-config="use_oidc=true" \
            -backend-config="tenant_id=${{ env.ARM_TENANT_ID }}"
            -backend-config="resource_group_name=tf-store-rg" \
            -backend-config="storage_account_name=satflabstore" \
            -backend-config="container_name=satflabstoreblob001" \
            -backend-config="key=terraform.tfstate"

      - name: 'Terraform Plan'
        run: |
          cd envs/dev
          terraform plan \
            -var="azure_tenant_id=${{ env.ARM_TENANT_ID }}"

      - name: 'Terraform Apply'
        run: |
          cd envs/dev
          terraform apply -auto-approve \
            -var="azure_tenant_id=${{ env.ARM_TENANT_ID }}"